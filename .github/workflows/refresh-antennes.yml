name: refresh-antennes

# Refresh automatique de public/data/antennes_par_commune_corse.json.
# Lit la table Supabase antennas_corse (colonne code_insee_commune, source
# de verite depuis la resolution du ticket SUPABASE-COMMUNE-FIELD-001),
# agrege par commune et operateur, ecrit le JSON.
#
# Cadence : 1er de chaque mois a 04h UTC (cron '0 4 1 * *').
# Declenchement manuel : Actions > refresh-antennes > Run workflow.
#
# Resolution du ticket ANTENNES-REFRESH-001 (Option 2 GitHub Actions).
# Dependances runtime : stdlib Python uniquement (urllib.request, json,
# pathlib). Pas de pip install.
#
# ─────────────────────────────────────────────────────────────────────────
# Retarget 2026-08-28 (brief C2, ferme #934) : ce workflow poussait sur
# `dev`, branche supprimee par ADR-021 → l'etape « Checkout dev » echouait
# a chaque run mensuel depuis le 2026-06-29 (runs 2026-07-01 et 2026-08-01
# = failure, silencieux). Aligne desormais sur intermagnet-cron.yml
# (pattern valide par le brief C1) : ouvre une PR depuis une branche dediee
# vers `main`, approuve ses propres runs `pull_request` en attente pour que
# le check REQUIS « Scan anti-fuite (lecture seule) » sorte de
# `action_required` et entre dans le statusCheckRollup, attend les 2 checks
# requis (Cloudflare Pages + Scan anti-fuite), merge en squash.
#
# ⚠ Piege GitHub (cf. brief C1) : une PR ouverte via le GITHUB_TOKEN par un
# bot ne declenche pas automatiquement les workflows `pull_request` — ils
# restent en `action_required`. Un run gate est `status=completed` +
# `conclusion=action_required` (PAS `status=action_required`). Un
# `workflow_dispatch` du meme workflow NE suffit PAS (check-run hors
# statusCheckRollup, non accepte par la protection de branche). La parade
# est d'APPROUVER les runs (POST /actions/runs/{id}/approve, actions:write).
# Aucun PAT, aucun --admin, aucun bypass.
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerer le JSON antennes par commune et merger si les checks passent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # POST /actions/runs/{id}/approve — debloque les checks requis de la PR bot
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script (stdlib uniquement, pas de pip install)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/build_antennes_par_commune_corse.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/antennes_par_commune_corse.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement detecte, skip."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/antennes_par_commune_corse.json
          fi

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="data/refresh-antennes-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/antennes_par_commune_corse.json
          COUNT_ANT=$(python -c "import json; d=json.load(open('public/data/antennes_par_commune_corse.json')); print(d['_meta']['n_antennes_placees'])")
          COUNT_COMM=$(python -c "import json; d=json.load(open('public/data/antennes_par_commune_corse.json')); print(d['_meta']['n_communes_avec_antenne'])")
          git commit -m "data: refresh mensuel antennes Corse ($COUNT_ANT antennes, $COUNT_COMM communes)

          Regeneration automatique via workflow refresh-antennes.
          Source : table Supabase antennas_corse.code_insee_commune.
          Ticket : ANTENNES-REFRESH-001."
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "data: refresh mensuel antennes Corse ($COUNT_ANT antennes, $COUNT_COMM communes)" \
            --body "Régénération automatique (workflow \`refresh-antennes\`) — pas de contenu applicatif nouveau, uniquement l'agrégat mensuel des antennes ANFR depuis Supabase \`antennas_corse\`. Auto-merge après CI verte (4 checks requis).")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Approuver les workflows en attente, attendre les checks requis, merger
        # Aligne sur intermagnet-cron.yml (brief "check requis + workflows bot alignes",
        # 2026-09-13) -- cette etape etait restee a l'ancienne version (2 checks requis,
        # pre-ADR-067) : `contrast-panels.yml` n'etait ni approuve ni attendu, alors que le
        # plancher est passe a 3 checks requis le 2026-09-09. Sans ce correctif, le PROCHAIN
        # run programme (cron mensuel, 1er du mois -- le dernier run date du 2026-09-01,
        # avant ADR-067, donc jamais encore rejoue avec 3 checks requis) aurait timeout sur
        # `gh pr checks --required --watch` en attendant un `contrast-panels` jamais
        # materialise -- meme mecanisme que l'incident C1 (2026-08-28), sur ce workflow-ci,
        # trouve avant qu'il ne se produise, pas apres.
        #
        # Les runs `pull_request` de la PR bot restent en `action_required` : on les
        # approuve pour qu'ils s'executent en contexte pull_request et entrent dans le
        # statusCheckRollup. GitHub materialise ces suites gatees avec une latence variable
        # (jusqu'a ~4 min observees) -> boucle d'approbation longue avant l'attente finale.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR="${{ steps.pr.outputs.pr_number }}"
          BRANCH="${{ steps.pr.outputs.branch }}"
          REPO="${{ github.repository }}"

          # NB modele de statut GitHub : un run gate est `status=completed` +
          # `conclusion=action_required` (PAS `status=action_required`). Une fois
          # approuve : conclusion=null (en cours) puis success/failure.
          approve_wf () {
            # $1 = fichier workflow ; approuve son run en attente d'approbation.
            gh run list --branch "$BRANCH" --workflow="$1" --limit 5 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status=="completed" and .conclusion=="action_required") | .databaseId' 2>/dev/null \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "Approbation $1 : run $id"
                gh api --method POST "repos/$REPO/actions/runs/$id/approve" || true
              done
          }

          materialise () {
            # $1 = fichier workflow ; vrai des que son run le plus recent sur la branche
            # est sorti du gate. "" / "null/null" = pas encore de run ;
            # "completed/action_required" = gate non approuve ; tout le reste
            # (in_progress/null, completed/success…) = run approuve et lance.
            row=$(gh run list --branch "$BRANCH" --workflow="$1" --limit 1 \
                  --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || true)
            case "$row" in
              ""|"null/null"|"completed/action_required") return 1 ;;
              *) return 0 ;;
            esac
          }

          # QUATRE workflows a approuver depuis le 2026-09-14 (etait TROIS depuis
          # ADR-067 le 2026-09-09, DEUX avant -- cf. commentaire ci-dessus).
          # `schema-payload-guard.yml` avait ete ajoute a `approve_wf` SEUL des le
          # 2026-09-13, par prudence, AVANT de devenir requis -- mais son ajout jumeau a
          # la condition de sortie `materialise`, explicitement promis pour "le jour ou
          # il le devient", n'avait pas ete fait. Ecart trouve et corrige le 2026-09-14,
          # au moment ou la protection de branche est passee a 4 checks (ADR-068,
          # amendant ADR-067) -- meme correctif que sur intermagnet-cron.yml, meme jour :
          # sans lui, la boucle pouvait sortir sans attendre schema-payload-guard, puis
          # `gh pr checks --required --watch` expirer sur ce 4e check jamais rattrape
          # (aucune approbation n'a lieu apres la sortie de boucle) -- le mecanisme du
          # C1 (2026-08-28), rejoue muettement. Pas observe en echec reel sur CE
          # workflow (cadence mensuelle, aucun run depuis le passage a 4 checks au
          # moment du correctif). La boucle ne sort que quand les checks actuellement
          # requis (leak-guard, contrast-panels, schema-payload-guard) sont tous
          # materialises.
          gha_ok=false
          for i in $(seq 1 48); do   # 48 * 5s = 4 min max d'attente de materialisation
            approve_wf leak-guard.yml
            approve_wf validate-code.yml
            approve_wf contrast-panels.yml
            approve_wf schema-payload-guard.yml
            if materialise leak-guard.yml && materialise contrast-panels.yml && materialise schema-payload-guard.yml; then
              gha_ok=true; break
            fi
            sleep 5
          done
          if [ "$gha_ok" != "true" ]; then
            echo "::warning::Workflows des checks requis pas tous declenches sur PR #$PR apres 4 min (leak-guard, contrast-panels et/ou schema-payload-guard) — laissee ouverte. Pas un retry sur CETTE PR : le prochain run fermera celle-ci (perimee) et en ouvrira une neuve si les donnees ont encore change."
            exit 0
          fi

          # Attente des 4 checks requis (Cloudflare Pages + Scan anti-fuite + Contraste
          # panneaux + Cles payload vs colonnes schema), pas les informatifs. Timeout
          # 5 min avant abandon (PR laissee ouverte, pas de merge force).
          if timeout 300 gh pr checks "$PR" --required --watch --interval 15; then
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "::warning::Checks requis pas verts (echec ou timeout) sur PR #$PR — laissee ouverte, pas mergee."
          fi
