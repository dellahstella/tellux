name: schema-payload-guard

# Garde clés-du-payload / colonnes-du-schéma. Statut requis/non-requis : voir la section
# datée ci-dessous, pas cette ligne — un statut gravé ici dériverait au premier changement.
#
# POURQUOI CE CHECK EXISTE
# ------------------------
# INS-018 (registre privé) : `protocole_aveugle` a été envoyé par le client
# vers Supabase pendant 4,5 mois sans jamais avoir de colonne — invisible
# depuis app.html, invisible depuis `_migrations/` (qui ne la mentionne pas),
# visible seulement en confrontant le payload au schéma Supabase VIVANT.
# `native_capture` porte aujourd'hui le même défaut, encore ouvert. Ce
# workflow automatise la confrontation ; `tests/blindage-harness/schema-payload-guard.mjs`
# porte la logique et son propre commentaire de tête, plus long — le lire
# avant de modifier l'un ou l'autre.
#
# STATUT AU 2026-09-13 — CANDIDAT AU REQUIS, PAS ENCORE REQUIS
# -----------------------------------------------
# Le défaut qui rendait ce check dangereux à requérir (`native_capture` sans
# colonne, rouge dès le premier run sur un état préexistant, pas une
# régression neuve) est résolu : migration 012 appliquée, colonne créée.
# 8 runs consécutifs verts depuis (2026-09-13, 13:06 → 20:46 ; 3 runs rouges
# juste avant, tous légitimes — le défaut réel avant sa correction, pas un
# faux positif). La commande pour le rendre requis est préparée
# (cf. brief « rendre le check requis », 2026-09-13) mais PAS exécutée ici :
# modifier la protection de branche reste un arbitrage Soleil, jamais
# auto-adopté par une session.
#
# ACCÈS AU SCHÉMA — NON PROVISIONNÉ ICI
# -----------------------------------------
# Le script a besoin de lire `information_schema.columns` sur le projet
# Supabase, ce que ni la clé anon publique ni PostgREST par défaut ne
# permettent. Il lit une variable `SUPABASE_MGMT_PAT` — provisionnée depuis
# le 2026-09-13 (vérifié : runs `workflow_dispatch` avec lecture réelle du
# schéma vivant, pas un skip). En son absence, le job sortirait proprement
# (exit 0, message explicite) plutôt que d'échouer ou de simuler un succès —
# comportement conservé si le secret venait à disparaître.
#
# FILTRE `paths:` RETIRÉ LE 2026-09-13 (présent à la création du fichier,
# légitime tant que ce check n'était pas requis — cf. historique git)
# ---------------------------------------------------------------------------
# INS-007/ADR-067 : un filtre `paths:` sur un check REQUIS laisse ~43 % des
# PR sans déclenchement — GitHub attend indéfiniment un statut qui ne sera
# jamais rapporté, PR gelée sans le moindre rouge. Ce check devenant
# candidat au statut requis, le filtre part avec la même justification qui
# l'avait posé : il ne s'appliquait qu'à un check non requis. Coût accepté :
# des runs sans objet sur des PR qui ne touchent aucun site de payload ni
# aucune migration — un run vert de plus, jamais un blocage.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-payload-guard:
    name: Clés payload vs colonnes schéma (lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécuter la garde (auto-tests puis, si le secret existe, lecture du schéma vivant)
        working-directory: tests/blindage-harness
        env:
          SUPABASE_MGMT_PAT: ${{ secrets.SUPABASE_MGMT_PAT }}
        run: node schema-payload-guard.mjs
        # Pas de `continue-on-error`: un vrai défaut détecté doit colorer ce
        # check en rouge (visible dans l'onglet Checks de la PR) — il n'est
        # simplement pas dans la liste des required status checks de `main`,
        # donc ce rouge ne bloque rien. « Report seulement » porte sur
        # l'effet (pas de blocage), pas sur la couleur (qui doit rester
        # honnête, cf. brief : « un rapport que personne ne lit n'est pas une
        # garde »).
