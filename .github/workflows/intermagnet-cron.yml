name: intermagnet-cron

# Refresh automatique de public/data/intermagnet_latest.json — niveau 1 de la
# hierarchie de correction externe geomagnetique (cf. app.html calcExternalCorr(),
# calcMagneticStatic()). Interroge BGS GIN (DUR/EBR/CLF) depuis ce job (hors
# navigateur, donc hors CORS — confirme bloquant en direct sur BGS GIN, cf. PR
# #1033) et ecrit un petit fichier statique, plutot qu'un proxy serveur : plus
# simple, plus robuste si BGS GIN est indisponible ponctuellement (le dernier
# fichier reste utilisable au lieu de casser une requete live).
#
# Brief "implementation 3 chantiers orphelins" (2026-08-26), chantier A/E.
#
# Architecture merge : `main` a une vraie protection de branche (PR obligatoire,
# pas seulement des checks requis, cf. verification 2026-08-26) — ce workflow
# n'ecrit donc JAMAIS directement sur main. Il ouvre une PR depuis une branche
# dediee, attend les 2 checks requis (Cloudflare Pages + Scan anti-fuite), puis
# la merge lui-meme (squash) UNIQUEMENT s'ils passent. Aucun contournement de la
# protection de branche, aucun secret/token special au-dela du GITHUB_TOKEN par
# defaut (contents:write + pull-requests:write + actions:write suffisent).
#
# ⚠ Piege GitHub (diagnostic brief C1, 2026-08-28 — PR #1049/#1051/#1052/#1053/
# #1064/#1069 restees ouvertes) : une PR ouverte via le GITHUB_TOKEN par un bot
# ne declenche PAS automatiquement les workflows `pull_request` — ils restent en
# `action_required` (approbation manuelle). Le check requis « Scan anti-fuite
# (lecture seule) » ne demarrait donc jamais → `gh pr checks --watch` expirait a
# 5 min → PR jamais mergee. (Cloudflare Pages, lui, tourne via son App GitHub
# independante, non affecte.) Parade : on declenche le scan anti-fuite nous-memes
# en `workflow_dispatch` (explicitement exempte de cette regle + du garde-fou
# anti-recursion du GITHUB_TOKEN) sur la branche du PR — son check-run se rattache
# au SHA de tete et satisfait la protection de branche, sans PAT ni bypass.
#
# Cadence : toutes les 30 minutes (aligne sur setInterval(loadAQU,...) cote
# client). Declenchement manuel : Actions > intermagnet-cron > Run workflow.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerer intermagnet_latest.json et merger si les checks passent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # gh workflow run leak-guard.yml (declenchement du scan anti-fuite requis)
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script (stdlib uniquement, pas de pip install)
        run: python3 scripts/fetch_intermagnet.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/intermagnet_latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement detecte, skip."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/intermagnet_latest.json
          fi

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="bot/intermagnet-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/intermagnet_latest.json
          STATION=$(python3 -c "import json; d=json.load(open('public/data/intermagnet_latest.json')); print(d['station_used'] or 'aucune')")
          DELTA=$(python3 -c "import json; d=json.load(open('public/data/intermagnet_latest.json')); print(d['delta_nT'])")
          git commit -m "data: refresh intermagnet_latest.json (station=$STATION, delta=${DELTA}nT)

          Regeneration automatique via workflow intermagnet-cron.
          Source : BGS GIN Edinburgh (DUR/EBR/CLF)."
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "data: refresh intermagnet_latest.json (station=$STATION, delta=${DELTA}nT)" \
            --body "Régénération automatique (workflow \`intermagnet-cron\`) — pas de contenu applicatif nouveau, uniquement les données du dernier cycle BGS GIN. Auto-merge après CI verte (2 checks requis).")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Declencher le scan anti-fuite requis sur la branche du PR
        # Voir le bloc « Piege GitHub » en tete de fichier : les runs `pull_request`
        # ouverts par le GITHUB_TOKEN restent en `action_required`. `workflow_dispatch`
        # est exempte de cette regle → on declenche le scan nous-memes ; son check-run
        # « Scan anti-fuite (lecture seule) » se rattache au SHA de tete du PR.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run leak-guard.yml --ref "${{ steps.pr.outputs.branch }}"

      - name: Attendre les checks requis et merger
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR="${{ steps.pr.outputs.pr_number }}"
          BRANCH="${{ steps.pr.outputs.branch }}"

          # 1. Scan anti-fuite (declenche a l'etape precedente) : attendre qu'il
          #    apparaisse (~5-15 s de latence de registration) puis qu'il se termine.
          RUN_ID=""
          for i in $(seq 1 18); do
            RUN_ID=$(gh run list --workflow=leak-guard.yml --branch "$BRANCH" \
                     --event workflow_dispatch --limit 1 --json databaseId \
                     --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::Scan anti-fuite non declenche sur PR #$PR — laissee ouverte."
            exit 0
          fi
          if ! gh run watch "$RUN_ID" --exit-status --interval 15; then
            echo "::warning::Scan anti-fuite non vert sur PR #$PR — laissee ouverte."
            exit 0
          fi

          # 2. Cloudflare Pages (App GitHub independante, ~15-40 s) : `gh pr checks
          #    --required` ne « voit » que celui-ci (le check dispatche n'est pas dans
          #    le statusCheckRollup du PR, mais la protection de branche, elle, le voit
          #    sur le SHA de tete). Timeout 4 min avant abandon.
          if ! timeout 240 gh pr checks "$PR" --required --watch --interval 15; then
            echo "::warning::Cloudflare Pages pas vert sur PR #$PR — laissee ouverte."
            exit 0
          fi

          # 3. Merge squash. La protection de branche revalide elle-meme les 2 checks
          #    requis sur le SHA de tete ; si l'un manque, `gh pr merge` echoue (pas de
          #    --admin, pas de bypass) → PR laissee ouverte, prochain cron reessaie.
          gh pr merge "$PR" --squash --delete-branch
