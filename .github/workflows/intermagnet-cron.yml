name: intermagnet-cron

# Refresh automatique de public/data/intermagnet_latest.json — niveau 1 de la
# hierarchie de correction externe geomagnetique (cf. app.html calcExternalCorr(),
# calcMagneticStatic()). Interroge BGS GIN (DUR/EBR/CLF) depuis ce job (hors
# navigateur, donc hors CORS — confirme bloquant en direct sur BGS GIN, cf. PR
# #1033) et ecrit un petit fichier statique, plutot qu'un proxy serveur : plus
# simple, plus robuste si BGS GIN est indisponible ponctuellement (le dernier
# fichier reste utilisable au lieu de casser une requete live).
#
# Brief "implementation 3 chantiers orphelins" (2026-08-26), chantier A/E.
#
# Architecture merge : `main` a une vraie protection de branche (PR obligatoire,
# pas seulement des checks requis, cf. verification 2026-08-26) — ce workflow
# n'ecrit donc JAMAIS directement sur main. Il ouvre une PR depuis une branche
# dediee, attend les 2 checks requis (Cloudflare Pages + Scan anti-fuite), puis
# la merge lui-meme (squash) UNIQUEMENT s'ils passent. Aucun contournement de la
# protection de branche, aucun secret/token special au-dela du GITHUB_TOKEN par
# defaut (contents:write + pull-requests:write + actions:write suffisent).
#
# ⚠ Piege GitHub (diagnostic brief C1, 2026-08-28 — PR #1049/#1051/#1052/#1053/
# #1064/#1069 restees ouvertes) : une PR ouverte via le GITHUB_TOKEN par un bot
# ne declenche pas automatiquement les workflows `pull_request` — ils restent en
# `action_required` (approbation manuelle). Le check REQUIS « Scan anti-fuite
# (lecture seule) » (workflow leak-guard.yml) ne demarrait donc jamais, et son
# contexte n'entrait pas dans le statusCheckRollup de la PR → merge bloque en
# permanence, `gh pr checks --watch` expirait a 5 min → PR jamais mergee.
# (Cloudflare Pages, lui, tourne via son App GitHub independante, non affecte.)
#
# Parade (ne fonctionne QUE si le check-run est produit en contexte pull_request —
# un `workflow_dispatch` du meme workflow produit bien un check-run sur le SHA de
# tete mais HORS statusCheckRollup, donc n'est PAS accepte par la protection de
# branche, teste 2026-08-28) : on APPROUVE nous-memes les runs `action_required`
# de la PR (POST /actions/runs/{id}/approve, permission actions:write). Ils
# s'executent alors reellement en contexte pull_request — scan complet, gate
# bloquant PR inclus — et leur check-run entre dans le rollup. Aucun PAT, aucun
# --admin, aucun bypass : le scan tourne pour de vrai et la protection de branche
# est satisfaite normalement.
#
# Cadence DEMANDEE : toutes les 30 minutes (`cron: '*/30 * * * *'` ci-dessous, aligne
# sur setInterval(loadAQU,...) cote client). Declenchement manuel : Actions >
# intermagnet-cron > Run workflow.
#
# ⚠ CADENCE REELLE : environ 3 h, PAS 30 minutes. CE N'EST PAS UNE PANNE.
# (constat CM, 2026-09-08 — corrige une ligne qui a longtemps annonce 30 minutes sans
# reserve, et qui pouvait faire rediagnostiquer une panne la ou il n'y en a pas.)
#
#   - `schedule` est documente par GitHub comme BEST-EFFORT : aux cadences fines, les
#     declenchements sont retardes ou sautes selon la charge de la plateforme. Un
#     `*/30` est une demande, jamais une garantie. Rien a corriger dans ce fichier.
#   - Mesure sur 90 executions du 2026-08-26 au 2026-09-08 : intervalle moyen ~3h30
#     entre RUNS.
#   - Mesure sur les mises a jour EFFECTIVES du fichier servi (ce qui compte pour le
#     client — la donnee n'atteint la production qu'au merge de la PR ouverte plus
#     bas) : mediane 3,19 h sur les 13 j, 3,19 h sur le regime post-02/09, 3,13 h sur
#     les 7 derniers jours. La mediane est remarquablement stable ; c'est elle qui est
#     desormais annoncee sur methode-limites-transparence.html §13, a la place du
#     « Temps reel (1h) » qui n'a jamais ete tenu.
#   - Disponibilite (age < INTERMAGNET_STALE_AFTER_MS = 3 h, cote app.html) : 56,3 %
#     sur les 13 j, mais 76,1 % sur le seul regime post-02/09. L'ecart entre les deux
#     vient des 21 echecs de cron, TOUS anterieurs au 2026-09-02 et resolus : citer le
#     56 % comme etat courant serait decrire une periode de panne close.
#
# CONSEQUENCE A NE PAS MANQUER, et qui n'est PAS traitee ici : la cadence reelle
# (mediane 3,19 h) est legerement AU-DESSUS du seuil de peremption de 3 h code dans
# app.html. Le niveau 1 perime donc sur une majorite de cycles par simple ecart entre
# les deux nombres, et le client descend au niveau 2 (Dst) — comportement normal et
# etiquete, pas une avarie. Le seuil est une entree de calcul d'une valeur publique :
# il n'est PAS modifie ici, ni la cascade. Arbitrage separe si un jour on veut fermer
# cet ecart, dans un sens ou dans l'autre.
#
# ⚠ PR ORPHELINES (constat 2026-09-08, PR publique #1184 restee ouverte 6 jours,
# CONFLICTING, checks pourtant tous verts) : l'etape finale a DEUX chemins qui
# quittent en succes (`exit 0`) sans merger — leak-guard pas materialise en 4 min,
# ou checks requis pas verts en 5 min. Dans les deux cas la PR reste ouverte,
# jamais mergee, et le run SUIVANT ouvre une NOUVELLE PR depuis une NOUVELLE
# branche sans jamais revenir sur l'ancienne — aucune purge, aucun retry cible.
# Une PR laissee ainsi devient rapidement CONFLICTING (le fichier qu'elle modifie
# est reecrit par le run suivant qui, lui, merge), et le reste indefiniment :
# gh pr merge echouerait de toute facon dessus (conflit), donc "le prochain cron
# reessaie" (commentaire de l'avertissement ci-dessous) ne se produit jamais pour
# CETTE PR precisement.
# Parade (etape "Fermer toute PR bot precedente encore ouverte" ci-dessous) : une
# PR de ce refresh n'a de sens que si elle est la PLUS RECENTE — toute PR bot
# ouverte au moment d'en creer une nouvelle est par construction perimee des que
# la nouvelle existe (memes donnees, plus fraiches). On la ferme donc AVANT
# d'ouvrir la suivante plutot que de la laisser s'accumuler.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerer intermagnet_latest.json et merger si les checks passent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # POST /actions/runs/{id}/approve — debloque les checks requis de la PR bot
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script (stdlib uniquement, pas de pip install)
        run: python3 scripts/fetch_intermagnet.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/intermagnet_latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement detecte, skip."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/intermagnet_latest.json
          fi

      - name: Fermer toute PR bot precedente encore ouverte
        # Toujours execute (pas conditionne a "changed") : une PR bot ouverte est
        # perimee des qu'ELLE-MEME est depassee par l'etat actuel de main, meme si
        # ce run-ci ne detecte aucun changement supplementaire. Fermeture, jamais
        # merge force : si elle etait encore mergeable et utile, gh pr merge
        # l'aurait deja prise avant que ce run ne s'execute.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --base main --search "head:bot/intermagnet-" \
            --json number --jq '.[].number' 2>/dev/null \
          | while read -r n; do
              [ -n "$n" ] || continue
              echo "Fermeture PR bot orpheline #$n (perimee par ce run)."
              gh pr close "$n" --delete-branch \
                --comment "Fermee automatiquement par le run suivant du cron intermagnet-cron : une PR de rafraichissement n'a de sens que la plus recente, celle-ci est perimee des qu'une nouvelle existe. Cf. commentaire en tete de .github/workflows/intermagnet-cron.yml (constat 2026-09-08, PR #1184)." \
                || echo "::warning::Fermeture PR #$n echouee (deja fermee ou fusionnee entre-temps ?)."
            done

      - name: Open PR if changed
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="bot/intermagnet-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/intermagnet_latest.json
          STATION=$(python3 -c "import json; d=json.load(open('public/data/intermagnet_latest.json')); print(d['station_used'] or 'aucune')")
          DELTA=$(python3 -c "import json; d=json.load(open('public/data/intermagnet_latest.json')); print(d['delta_nT'])")
          git commit -m "data: refresh intermagnet_latest.json (station=$STATION, delta=${DELTA}nT)

          Regeneration automatique via workflow intermagnet-cron.
          Source : BGS GIN Edinburgh (DUR/EBR/CLF)."
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "data: refresh intermagnet_latest.json (station=$STATION, delta=${DELTA}nT)" \
            --body "Régénération automatique (workflow \`intermagnet-cron\`) — pas de contenu applicatif nouveau, uniquement les données du dernier cycle BGS GIN. Auto-merge après CI verte (2 checks requis).")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Approuver les workflows en attente, attendre les checks requis, merger
        # Voir le bloc « Piege GitHub » en tete de fichier. Les runs `pull_request`
        # de la PR bot (dont le check requis « Scan anti-fuite (lecture seule) »)
        # restent en `action_required` : on les approuve pour qu'ils s'executent en
        # contexte pull_request et entrent dans le statusCheckRollup de la PR.
        # GitHub materialise ces suites gatees avec une latence variable (jusqu'a
        # ~4 min observees) → boucle d'approbation longue avant l'attente finale.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR="${{ steps.pr.outputs.pr_number }}"
          BRANCH="${{ steps.pr.outputs.branch }}"
          REPO="${{ github.repository }}"

          # NB modele de statut GitHub : un run gate est `status=completed` +
          # `conclusion=action_required` (PAS `status=action_required`). Une fois
          # approuve : conclusion=null (en cours) puis success/failure.
          approve_wf () {
            # $1 = fichier workflow ; approuve son run en attente d'approbation.
            gh run list --branch "$BRANCH" --workflow="$1" --limit 5 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status=="completed" and .conclusion=="action_required") | .databaseId' 2>/dev/null \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "Approbation $1 : run $id"
                gh api --method POST "repos/$REPO/actions/runs/$id/approve" || true
              done
          }

          leak_ok=false
          for i in $(seq 1 48); do   # 48 * 5s = 4 min max d'attente de materialisation
            approve_wf leak-guard.yml
            approve_wf validate-code.yml
            row=$(gh run list --branch "$BRANCH" --workflow=leak-guard.yml --limit 1 \
                  --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || true)
            # "" / "null/null" = pas encore de run ; "completed/action_required" = gate non approuve ;
            # tout le reste (in_progress/null, completed/success…) = run approuve et lance
            case "$row" in
              ""|"null/null"|"completed/action_required") : ;;
              *) leak_ok=true; break ;;
            esac
            sleep 5
          done
          if [ "$leak_ok" != "true" ]; then
            echo "::warning::Scan anti-fuite pas declenche sur PR #$PR apres 4 min — laissee ouverte. Pas un retry sur CETTE PR : le prochain run fermera celle-ci (perimee) et en ouvrira une neuve si les donnees ont encore change."
            exit 0
          fi

          # Attente des 2 checks requis (Cloudflare Pages + Scan anti-fuite), pas les
          # informatifs. Timeout 5 min avant abandon (PR laissee ouverte, pas de merge force).
          if timeout 300 gh pr checks "$PR" --required --watch --interval 15; then
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "::warning::Checks requis pas verts (echec ou timeout) sur PR #$PR — laissee ouverte, pas mergee. Le prochain run la fermera (perimee) plutot que d'y revenir."
          fi
