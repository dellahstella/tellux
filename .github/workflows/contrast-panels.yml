name: contrast-panels

# Garde-fou contraste des panneaux flottants d'app.html.
#
# POURQUOI CE CHECK EXISTE
# ------------------------
# Les panneaux flottants du chrome carte sont peuplés en JS avec des styles
# INLINE référençant des tokens de design : rien ne garantit qu'un couple
# texte/fond y reste lisible, ces chaînes échappant à toute revue de feuille
# de style.
#
# Cas réel (PR #1148, 2026-08-31) : la jauge crustale sortait sa valeur
# principale à un contraste de 1,07 — invisible. Repéré à l'œil, par chance.
# Ce check remplace la chance par une mesure.
#
# Depuis le retrait du mode sombre (2026-08-31), la mesure porte sur le thème
# unique servi en production.
#
# CE CHECK EST BLOQUANT, DÈS SA CRÉATION
# --------------------------------------
# Contrairement à eval-app-rubric (Phase A informative), celui-ci bloque tout
# de suite, parce qu'il est calé sur un CLIQUET et non sur un idéal.
# Historique des plafonds, pour comprendre une régression future :
#   • 2026-08-31 (création)         : 19 critique + 49 aa (deux thèmes)
#   • 2026-08-31 (retrait mode sombre) : 4 critique + 26 aa (thème unique —
#     les 15+23 disparues n'étaient PAS corrigées, leur surface a cessé d'exister)
#   • 2026-08-31 (correctifs contraste) : 0 + 0 — les 30 restantes ont cette
#     fois été CORRIGÉES (--tx3 diverge de --tx-mica racine gelée, fallbacks
#     CSS qui ne se déclenchaient jamais réparés, 3 hex assombris sur leurs
#     seuls usages textuels)
#   • 2026-09-01 (élargissement à 10 panneaux, dont le popup au clic) : révèle
#     28 violations préexistantes, JAMAIS mesurées avant ce jour — cliquets
#     laissés à 0/0 pendant toute leur résorption (check volontairement rouge),
#     jamais desserrés pour absorber l'élargissement
#   • 2026-09-02 (clôture) : les 28 résorbées (lots 1/2/2bis/3) -> 0 + 0 CONFIRMÉ
#     sur la mesure réelle du périmètre élargi, pas seulement hérité par défaut
#   • 2026-09-03 (brief U — balayage des branches de #conditions-bar) : 1 violation
#     critique (2,91) sur le badge Kp, non pas nouvelle mais RÉVÉLÉE — sa branche
#     `--warn` n'avait jamais pu s'exécuter tant que curKp restait à « — » (bug
#     Promise.all de loadNOAA, corrigé par le brief P/#1198). Corrigée par un ocre
#     de texte (--warn-tx). Cliquets INCHANGÉS à 0/0.
# Déterminisme vérifié à chaque palier avant promotion du plafond — y compris
# celui-ci : 2 runs consécutifs identiques avant la clôture du 2026-09-02, et
# 3 runs consécutifs identiques le 2026-09-03 après l'ajout du balayage.
#
# CE CHECK EST REQUIS SUR `main` DEPUIS LE 2026-09-09
# --------------------------------------------------
# Bloquant et requis ne sont pas le même mot. Bloquant depuis sa création : quand
# il tourne et qu'il mesure une régression, il sort en échec. Requis depuis le
# 2026-09-09 : sans lui, plus de merge. Ce qui change n'est pas sa sévérité, c'est
# qu'on ne peut plus merger en son absence — et l'absence était jusqu'ici son mode
# de défaillance le plus discret (filtre `paths` retiré le même jour, voir `on:`).
#
# Le plancher CI passe de 2 à 3 checks requis : Cloudflare Pages, Scan anti-fuite
# (lecture seule), Contraste panneaux (thème unique). Amende ADR-045, qui avait
# posé le plancher à 2.
#
# LE NOM ENREGISTRÉ DANS LA PROTECTION EST CELUI DU JOB, PAS CELUI DU WORKFLOW :
# « Contraste panneaux (thème unique) », littéral statique du champ `name:` du job
# ci-dessous — aucune expression `${{ }}`, donc identique sous `pull_request` et
# sous `workflow_dispatch` (vérifié le 2026-09-09 sur les deux : tête de PR #1372
# et main @118776c2). Renommer ce job casse silencieusement la protection : elle
# attendrait un contexte que plus rien ne produit. Le nom du workflow
# (`contrast-panels`, en tête de fichier) n'est PAS ce que la protection observe.
#
# Un `workflow_dispatch` NE PEUT PAS satisfaire la protection, même à nom égal :
# son check-run apparaît bien sur le SHA de tête mais reste HORS du
# statusCheckRollup de la PR (constaté le 2026-08-28, cf. en-tête d'
# `intermagnet-cron.yml`). C'est une propriété souhaitable et non une limite : on
# ne débloque pas une PR en déclenchant le check à la main.

# UN CHECK QUI DÉPEND DE LA MÉTÉO SPATIALE NE PROTÈGE RIEN (2026-09-03)
# ---------------------------------------------------------------------
# La même PR (#1204) a produit un run ROUGE puis, 17 minutes plus tard et sans
# qu'une ligne ne change, des runs VERTS : la barre de conditions colore ses
# puces par ternaire sur le Kp NOAA du moment, et la branche mesurée dépendait
# donc de l'activité solaire à l'heure du run. Un tel check est vert la plupart
# du temps et rouge au hasard — il ne protège pas, il use la confiance.
# Le script balaie désormais les branches de #conditions-bar sous FIXTURES
# (4 scénarios : calme / modéré / actif / tempête), en ré-invoquant les vraies
# fonctions de production avec un fetch stubbé. Le périmètre n'est PAS élargi :
# c'est la même surface, déjà mesurée, dont on couvre enfin toutes les branches.
#
# CE QUE CE CHECK COUVRE, ET CE QU'IL NE COUVRE TOUJOURS PAS (2026-09-02)
# ------------------------------------------------------------------------
# Couvre : 10 panneaux déclarés (9 mesurables sans couche contextuelle active —
# Zone 2 reste masquée sinon), le popup au clic sur 4 points distincts (pas 1),
# #conditions-bar sous 4 scénarios forcés (depuis le 2026-09-03), un contrôle par
# surface qui fait échouer le check si une surface requise ne
# se peuple plus. Ne couvre PAS : le tiroir déplié #conditions-bar-details, replié
# en production donc en display:none — il porte 16 violations préexistantes
# MESURÉES le 2026-09-03 (15 de la famille --tx-mica à 4,33, + « (JSON) » à 4,37),
# indépendantes des branches de couleur ; leur remédiation touche un token gelé
# (A11Y-CONTRAST-001) et fait l'objet d'un lot séparé, pas d'un fourre-tout ici.
# Ne couvre pas non plus : le popup au placement d'une contribution
# terrain (dette distincte, POPUP-REOPEN-DURING-CONTRIB-PLACEMENT-001, pas un
# problème de contraste) ; les branches de `deltaCol` (vert/ocre/porphyre) —
# aucun des 4 points n'a de contribution terrain assez proche pour produire un
# delta réel, elles ne sont donc jamais exercées ; le mode Expertise dans une
# langue autre que FR (jamais testé sous ?lang=en/co) ; tout contenu qui
# n'existe que sur mobile (ce harnais tourne en viewport desktop fixe).
#
# LES PLAFONDS NE REMONTENT JAMAIS
# --------------------------------
# Si ce check tombe, la réponse est de corriger le contraste, PAS d'augmenter
# le plafond. Les seuls commits légitimes sur ces deux nombres les font
# DESCENDRE. À 0/0, il n'y a plus qu'une direction possible : rester à 0/0.

on:
  pull_request:
    branches:
      - main
    # PAS de filtre `paths` — retiré le 2026-09-09, en même temps que ce check est
    # devenu REQUIS sur main. Ce n'est pas un choix de confort : ADR-045 clause (4)
    # l'exige, mot pour mot, « workflow sans filtre `paths` sur PR (sinon required
    # check pending = PR gelée) ». Un check requis dont le workflow ne se déclenche
    # pas ne rend AUCUN statut — GitHub ne le voit pas comme réussi ni comme échoué,
    # il l'attend, indéfiniment, et la PR devient immergeable sans qu'aucun rouge
    # n'apparaisse nulle part.
    #
    # Ce n'était pas une hypothèse. Mesuré le 2026-09-09 sur les 30 dernières PR
    # mergées : 13 tombaient hors de l'ancien périmètre, dont 9 rafraîchissements
    # automatiques de `public/data/intermagnet_latest.json` ouverts par
    # `intermagnet-cron`. Le filtre conservé aurait gelé la chaîne de données
    # magnétiques, à la première PR suivant la pose de la protection. Vérifié aussi
    # dans l'autre sens sur la PR #1373 (données INTERMAGNET seules) : quatre checks
    # ont rapporté, celui-ci n'en faisait pas partie.
    #
    # Prix de la levée, mesuré sur les 5 derniers runs : 72 à 93 s par PR — 33 s
    # d'installation Chromium, 31 s de mesure, le reste en préparation. C'est le coût
    # de mesurer sur toute PR plutôt que sur celles qu'une liste désigne.
    # `leak-guard.yml` a pris la même décision le 2026-07-09, pour la même raison,
    # et porte la même note dans son propre `on:`.
    #
    # CE QUE LE FILTRE PORTAIT, ET QUI NE DOIT PAS SE PERDRE AVEC LUI : il avait été
    # élargi quelques heures plus tôt le 2026-09-09 à
    # `tests/blindage-harness/supabase-cache.mjs`, module importé par
    # `contrast-panels.mjs`, dont les lignes « MISS » partaient sur stdout, où le
    # workflow attendait le JSON de résultat (run #34374902822). Cette pollution n'a
    # fait rougir aucun run — l'étape tourne sous `set +e` et capture le code de
    # sortie avant tout `jq` — mais elle rendait le rapport illisible : le rouge du
    # même jour, dû au plancher de `#conditions-bar` après #1363 (corrigé par #1372),
    # est resté 3 h 31 sans diagnostic. La première version de ce commentaire (#1374)
    # imputait ce rouge aux lignes MISS : c'est faux (ADR-067, *Réfutation*).
    # Le check ne surveillait pas une de ses propres dépendances : une modification
    # du cache ne pouvait ni le casser visiblement, ni être validée par lui. La règle
    # qu'on en avait tirée — « toute dépendance du harnais qui entre dans ce
    # processus appartient à cette liste » — survit à la liste : sans filtre, elle
    # est tenue par construction, pour toute dépendance présente ou future, sans que
    # personne ait à penser à l'y inscrire. Une liste, elle, redevient fausse au
    # premier ajout, et en silence.
  workflow_dispatch:

# Annule un run devenu obsolète quand un nouveau push arrive sur la même PR
# avant que le précédent ait fini (brief BQ, 2026-09-05 — mesuré : ~1,89
# runs/branche sur ce workflow, une partie réelle mais non quantifiée à
# l'avance de runs superflus). Groupé par numéro de PR (repli sur la ref pour
# workflow_dispatch, ex. main) — ne peut donc jamais annuler un run sur une
# AUTRE PR, ni sur `main` : ce workflow ne se déclenche que sur pull_request,
# jamais sur push vers main (vérifié dans ce fichier même, ci-dessus), donc
# aucun run ne tourne jamais avec `github.ref == refs/heads/main` sauf un
# déclenchement manuel explicite depuis main — cas qui n'est ni requis ni
# bloquant (cf. plancher CI, ADR-045). Le dernier push d'une PR reste TOUJOURS
# vérifié avant merge : seuls les runs strictement supersédés sont coupés.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contrast:
    name: Contraste panneaux (thème unique)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/blindage-harness/package-lock.json

      - name: Install npm deps (tests/blindage-harness)
        working-directory: tests/blindage-harness
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests/blindage-harness
        run: npx playwright install --with-deps chromium

      # ═══ Cache Supabase du harnais (brief BN) — restauration sur les runners ═══
      # Le cache posé par la PR #1263 vit dans $XDG_CACHE_HOME/tellux/harness-supabase-cache,
      # c'est-à-dire le disque ÉPHÉMÈRE du runner. Aucun workflow ne le restaurait : chaque run
      # repartait d'un dossier vide et rechargeait tout depuis le réseau. Le cache réduisait
      # donc le trafic en local et rien en CI, sans que rien ne le signale — les lignes « MISS »
      # du module partaient alors sur stdout, redirigé vers contrast-result.json, donc invisibles
      # dans les journaux du job. Constaté le 2026-09-08 non par ces journaux mais par les
      # journaux edge Supabase, qui comptaient les requêtes réellement arrivées.
      #
      # CE N'EST PLUS LE CAS depuis le 2026-09-09, par deux correctifs indépendants du même jour :
      # #1370 a fait passer ces lignes sur stderr, et #1371 a retiré la redirection (le script
      # écrit son rapport lui-même). Les « MISS » sont désormais lisibles dans les journaux du
      # job, et aucun écrivain sur stdout ne peut plus atterrir dans le rapport.
      #
      # CLÉ À ROTATION HEBDOMADAIRE, alignée sur le TTL de 7 jours du module. Une clé fixe
      # aurait un mode d'échec silencieux : au bout de 7 jours toutes les entrées expirent,
      # repartent au réseau, et comme la clé exacte est trouvée le job ne ré-enregistre jamais
      # rien — le cache resterait froid pour toujours en ayant l'air posé. Avec la rotation, le
      # premier run de chaque semaine manque la clé exacte, restaure la semaine précédente par
      # `restore-keys`, rafraîchit ce qui a expiré et ré-enregistre. Un seul enregistrement par
      # semaine, jamais de dérive muette.
      - name: Semaine ISO (clé de cache)
        id: semaine
        run: echo "cle=$(date -u +%G-S%V)" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Supabase du harnais
        uses: actions/cache@v4
        with:
          path: ~/.cache/tellux/harness-supabase-cache
          key: harness-supabase-cache-v1-${{ steps.semaine.outputs.cle }}
          restore-keys: harness-supabase-cache-v1-

      - name: Run contrast-panels
        id: contrast
        working-directory: tests/blindage-harness
        env:
          # ═══ CLIQUETS — ne jamais remonter, voir l'en-tête de ce fichier ═══
          # 0/0 depuis le 2026-08-31 (dette A11Y-CONTRAST-APP-PANELS-002 résorbée, pas
          # seulement recalibrée) : les 30 violations restantes après le retrait du mode
          # sombre (4 critique + 26 AA, thème clair) ont été CORRIGÉES — --tx3 diverge de
          # --tx-mica (racine gelée intacte), .leg-src + 5 titres à fallback CSS
          # "var(--tx-mica,var(--tx3))" qui ne se déclenchait jamais (--tx-mica toujours
          # défini) corrigés, 3 hex codés en dur (#8b92a5/#6b7280/#b85c00) assombris sur
          # leurs SEULS usages textuels — jamais sur les swatches/couleurs de carte qui
          # partagent le même hex par signification. Plus aucune marge : la moindre
          # régression fait tomber le check.
          #
          # 2026-09-01 — L'ÉLARGISSEMENT DU PÉRIMÈTRE (5 surfaces ajoutées, cf. PANELS dans
          # contrast-panels.mjs, dont le POPUP au clic — probablement la surface la plus vue de
          # l'app, jamais mesurée avant ce jour) a révélé 28 violations préexistantes — 21
          # critique, 7 AA. Les cliquets sont RESTÉS à 0/0 pendant toute la résorption : la règle
          # interdit de les remonter pour absorber un élargissement, donc le check est resté
          # VOLONTAIREMENT ROUGE le temps que chaque violation soit triée (corrigée ou groupée
          # dans un lot arbitré), jamais que le plafond soit desserré pour le faire taire.
          # 2026-09-02 — CLÔTURE : les 28 ont toutes été traitées (lots 1/2/2bis/3, PR #1165,
          # #1167, #1168, #1173, #1175 — cf. dette privée A11Y-CONTRAST-APP-PANELS-002 pour le
          # détail par lot). Cliquets confirmés à 0/0 SUR LA MESURE RÉELLE, pas laissés à 0/0 par
          # défaut : déterminisme vérifié sur 2 runs consécutifs avant cette clôture.
          CONTRAST_MAX_CRITIQUE: '0'
          CONTRAST_MAX_AA: '0'
          # Plancher de couverture — les cliquets sont des MAJORANTS : si les panneaux ne se
          # peuplaient pas (Supabase KO, boot trop lent, sélecteur renommé), le compte de
          # violations tomberait à 0 et le check passerait sans rien avoir testé.
          # Historique : 100 nœuds/5 panneaux (2026-08-31, plancher 40, ~40 %) -> 192 nœuds/10
          # panneaux déclarés, 9 mesurés (2026-09-01, élargissement, plancher porté à 75, même
          # proportion) -> 186 nœuds (2026-09-02, après le retrait du radon #1172, qui a retiré
          # des nœuds du popup et de « Mon lieu » — plancher 75 INCHANGÉ, encore très largement
          # tenu). Sans cette remontée du 09-01, l'élargissement aurait pu passer au vert en ne
          # mesurant rien de plus que les 5 surfaces d'origine. Complété par un contrôle PAR
          # SURFACE dans le script (`requis: true`) : une surface ajoutée qui ne s'ouvre plus fait
          # échouer le check au lieu de disparaître en silence — protège CE que le plancher global
          # ne peut pas voir (une surface qui tombe à zéro pendant qu'une autre grossit).
          CONTRAST_MIN_NOEUDS: '75'
        run: |
          set +e
          # Plus de redirection (2026-09-09, #1371) : le script écrit contrast-result.json
          # lui-même. Avec `> contrast-result.json`, tout ce qu'un module imprimait sur
          # stdout atterrissait DANS le JSON — le module de cache Supabase y déversait
          # ses lignes « MISS/expiré » et jq échouait en « parse error … line 1, column
          # 17 ». Cela n'a jamais fait rougir un run : EXIT est capturé juste après le
          # script, avant le premier jq, et l'étape tourne sous `set +e`. La pollution
          # détruisait l'explication — résumé du job et artefact illisibles —, pas la
          # mesure. Le rouge du 2026-09-09 (17 runs, exit 2) venait du plancher de
          # #conditions-bar après #1363 ; la pollution l'a rendu muet pendant 3 h 31.
          # La première version de ce commentaire disait que le check « tombait AVANT
          # toute mesure » : c'est faux (ADR-067, *Réfutation*). Effet de bord bienvenu :
          # les journaux des modules redeviennent visibles ici, ce que le commentaire du
          # cache ci-dessus regrettait explicitement.
          node contrast-panels.mjs
          EXIT=$?
          # Le rapport est-il seulement lisible ? Sans ce garde, un JSON invalide ne
          # changeait pas la couleur : il produisait « jq: parse error » huit fois et un
          # résumé vide, à côté du vrai code de sortie — un défaut muet, qui a laissé le
          # rouge du 2026-09-09 sans diagnostic. Désormais, un rapport illisible fait
          # échouer l'étape avec son propre message : il ne peut plus cacher la cause
          # d'un rouge, ni accompagner un vert.
          if ! jq -e . contrast-result.json >/dev/null 2>&1; then
            echo "::error::contrast-result.json illisible — le rapport n'a pas été produit correctement (le contraste n'a PAS été mesuré). Premiers octets du fichier :"
            head -c 300 contrast-result.json || true
            exit 1
          fi
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          CRIT=$(jq -r '.resume.critique' contrast-result.json)
          AA=$(jq -r '.resume.aa' contrast-result.json)
          PCRIT=$(jq -r '.resume.plafond_critique' contrast-result.json)
          PAA=$(jq -r '.resume.plafond_aa' contrast-result.json)
          NOEUDS=$(jq -r '.resume.noeuds_mesures' contrast-result.json)
          PANS=$(jq -r '.resume.panneaux_mesures' contrast-result.json)
          {
            echo "## Contraste des panneaux flottants"
            echo ""
            if [ "$EXIT" = "0" ]; then
              echo "### ✅ Aucune régression"
            else
              echo "### ❌ Régression de contraste"
              echo ""
              echo "> Corriger le contraste. **Ne pas remonter les plafonds** pour faire passer la PR."
            fi
            echo ""
            echo "| Tranche | Mesuré | Plafond |"
            echo "|---|---|---|"
            echo "| Critique (ratio < 3,0 — illisible) | $CRIT | $PCRIT |"
            echo "| AA (sous le seuil WCAG applicable) | $AA | $PAA |"
            echo ""
            PNOE=$(jq -r '.resume.plancher_noeuds' contrast-result.json)
            echo "_$NOEUDS nœuds de texte mesurés (plancher $PNOE) sur $PANS panneaux._"
            echo ""
            if [ "$EXIT" != "0" ]; then
              echo "#### Violations critiques"
              echo ""
              echo '| Panneau | Ratio | Couleur | Fond effectif | Texte |'
              echo '|---|---|---|---|---|'
              jq -r '.violations_critiques[] | "| \(.panel) | \(.ratio) | `\(.couleur)` | `\(.fond_effectif)` | \(.texte) |"' contrast-result.json | head -25
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: Upload rapport JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-result
          path: tests/blindage-harness/contrast-result.json
          retention-days: 14
