name: Veille Scholar hebdomadaire

# Synthèse hebdo des Google Scholar Alerts via Anthropic API,
# committée dans un dépôt de coordination interne (slug fourni via secret PRIVATE_REPO).
# Brief : .github/scripts/veille_scholar.py

on:
  # SCHEDULE SUSPENDU LE 2026-09-12 — le cron ne tirait plus que des rouges. Deux causes
  # distinctes, dont la première masque la seconde :
  #   - « Your credit balance is too low to access the Anthropic API » (400), dry run manuel
  #     du 2026-09-10 à 15:05Z : un solde à recharger. Tant qu'il bloque, aucun run ne peut
  #     révéler autre chose.
  #   - « prompt is too long » (400), run programmé du 2026-09-07 à 13:49Z : le corpus
  #     d'entrée a dépassé la fenêtre du modèle. Le script MESURE pourtant son entrée avant
  #     l'appel (count_tokens, .github/scripts/veille_scholar.py) et l'envoie quand même :
  #     un compteur, pas un garde. C'est le vrai défaut, et il reviendra au premier run
  #     redevenu possible — probablement plus gros, la fenêtre de 7 jours ayant accumulé
  #     les alertes non traitées depuis.
  # Le mécanisme n'est pas mort : cinq runs programmés verts d'affilée du 2026-07-27 au
  # 2026-08-24, puis rouges les 31/08 et 07/09. On l'arrête pour que le lundi ne produise
  # pas un rouge de plus, on ne le supprime pas : `workflow_dispatch` reste, avec ses
  # entrées, et la récolte à la main est inchangée.
  # RÉTABLIR — décommenter les deux lignes ci-dessous, dans cet ordre : crédit rechargé
  # (avec une alerte de seuil), puis count_tokens devenu un garde (au-delà du seuil :
  # tronquer, découper, ou échouer en disant combien et de quoi), puis vérifier le premier
  # run programmé.
  # schedule:
  #   # Tous les lundis à 8h UTC (~9h Paris hiver / 10h Paris été)
  #   - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Fenêtre de recherche en jours"
        required: false
        default: "7"
      dry_run:
        description: "Si '1', n'écrit pas dans le repo privé"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo (script seul)
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            anthropic \
            requests

      # Hors ligne, sans secret : vérifie les bornes du corpus (2026-09-10) avant tout
      # appel au modèle. Une borne cassée arrête le run ici, pas en 400 chez Anthropic.
      - name: Contrôles hors ligne des bornes du corpus
        run: python .github/scripts/test_veille_scholar.py

      - name: Run veille_scholar
        env:
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub interdit les secrets commencant par GITHUB_ (préfixe réservé)
          # → secret renommé GH_PATH côté GitHub, mappé sur env var GITHUB_PAT pour le script
          GITHUB_PAT: ${{ secrets.GH_PATH }}
          # Slug owner/repo du dépôt de coordination interne (cible des écritures).
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          # Garde-fou d'archi (décision 2026-06-08) : le cron hebdo collecte uniquement
          # (digest dans une file inbox du dépôt cible). L'intégration au corpus est
          # mensuelle, séparée, gatée par scripts/verify_citation.py. RUN_INTEGRATION
          # reste à "0" en cron ; manuel uniquement (workflow_dispatch ou run local).
          RUN_INTEGRATION: '0'
          # PROMPT_PATH non surchargé : le script utilise son défaut
          # docs/pilotage/prompt_veille_tellux_v2.md (commité 2026-05-11 dans le privé).
        run: python .github/scripts/veille_scholar.py
