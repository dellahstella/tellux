name: R5 — Garde-fou doctrine anti-fuite

# Routine R5 (garde-fou doctrine, 2026-06-23 ; périmètre élargi 2026-06-29, ADR-019).
# Substrat : GitHub Actions (ADR-010).
# Scanne tous les fichiers TEXTE TRACKÉS (= clonables : .html/.md/.txt/.yml/.json éditoriaux),
# pas seulement les 9 .html déployés — le scanner dérive sa surface de `git ls-files` (gitignored
# exclu de facto), filtrée par extension + garde-fous (data/binaires exclus, cap taille, auto-exclusion
# des fichiers du garde-fou). Motivation : un .md tracké (NOTE_METHODE_CO.md) a échappé au scan .html
# le 2026-06-29 (fix manuel #893). 3 classes de fuite doctrine v4 :
#   - FUITE       : raison sociale (secret LEAK_TERMS_REGEX), FEDER/ANR/OS1.2/candidature,
#                   corpus privé, axes, SARL/SASU, SIRET espacé.
#   - PROSCRIT    : formulations interdites (exception étroite « cité/réfuté »).
#   - GELÉ (DIFF) : modification des blocs EXPERT_*_DEFAULT / calcGammaAmbient / NCRP 94 dans app.html.
#
# DÉTECTE et SIGNALE (ouvre/maj une issue). Sur cron/push = ALERT-ONLY (ne casse pas le build).
# Sur PULL_REQUEST = GATE BLOQUANT (step « Gate bloquant ») : un finding de classe FUITE (fuite réelle)
# ou CONFIG (scanner dégradé — secret absent, fichier sauté par le cap de taille, régex invalide,
# grep en échec, scan interrompu, surface vide) fait ÉCHOUER le check → merge bloqué
# (fail-closed : un scan requis n'est jamais silencieusement aveugle NI partiel — durci 2026-07-10). PROSCRIT / GELÉ restent
# NON bloquants (signalés) même sur PR : éviter de geler main sur de la pédagogie (exception cité/réfuté)
# ou un edit de zone gelée légitime (process physicien). Le scanner reste exit 0 (détecteur) ; le blocage
# est un step de gate lisant sa sortie. Ni l'issue ni le gate ne recopient la chaîne sensible (emplacement
# + classe seulement). Marqueurs sensibles NON en clair ici : raison sociale = secret LEAK_TERMS_REGEX,
# modules confidentiels = secret LEAK_CONFIDENTIAL_REGEX ; absent → classe sautée + finding CONFIG.
# Allowlist par chemin : .github/scripts/leak_guard_allowlist.txt (« chemin<TAB>label »).
# Activation depuis main (défaut) pour le cron ; aussi sur push/PR touchant une surface texte.

on:
  schedule:
    - cron: '30 8 * * 1'   # lundi 08:30 UTC (hebdo, décalé des autres routines)
  workflow_dispatch: {}
  pull_request:
    # PAS de filtre `paths` : ce workflow est un REQUIRED status check sur main (2026-07-09).
    # Un required check filtré par chemins ne s'exécute pas sur les PR ne touchant que des fichiers
    # hors périmètre (.js/.css/.sql/.png…) → le check resterait « pending » et GÈLERAIT ces PR.
    # Il doit donc tourner sur TOUTE PR (le scanner dérive sa surface de git ls-files de toute façon,
    # ~15-20 s). Le filtre `paths` reste sur `push` (post-merge, non bloquant).
  push:
    branches: [main, dev]
    paths:
      - '**/*.html'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - '**/*.jsonc'
      - '.github/scripts/leak_guard*'

permissions:
  contents: read
  issues: write

jobs:
  leak-guard:
    name: Scan anti-fuite (lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique requis pour le diff zones gelées

      - name: Scan présence (FUITE / PROSCRIT)
        id: scan
        env:
          LEAK_TERMS_REGEX: ${{ secrets.LEAK_TERMS_REGEX }}
          LEAK_CONFIDENTIAL_REGEX: ${{ secrets.LEAK_CONFIDENTIAL_REGEX }}
        run: |
          set +e
          bash .github/scripts/leak_guard.sh . > findings.txt 2> warn.txt
          cat warn.txt || true
          exit 0

      - name: Diff zones gelées (GELÉ-001 / NCRP-001) sur app.html
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set +e
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas de base de diff exploitable — contrôle zones gelées sauté."
            exit 0
          fi
          HITS=$(git diff "$BASE" "$HEAD" -- app.html \
                 | grep -E '^[-+]' | grep -vE '^(\+\+\+|---)' \
                 | grep -cE 'EXPERT_WEIGHTS_DEFAULT|EXPERT_BOUNDS_DEFAULT|EXPERT_EPISTEMIC_NOTE|calcGammaAmbient|NCRP')
          if [ "${HITS:-0}" -gt 0 ]; then
            echo "app.html:diff	GELE	zone_gelee_modifiee(${HITS}_lignes)" >> findings.txt
          fi
          exit 0

      - name: Résumé
        id: summary
        continue-on-error: true
        run: |
          set +e
          # La ligne META (sentinelle de fin de scan) est de la plomberie : exclue du compte
          # et de l'affichage (elle est exigée par le gate PR, pas signalée en issue).
          COUNT=0
          if [ -s findings.txt ]; then COUNT=$(awk -F'\t' '$2!="META"{c++} END{print c+0}' findings.txt); fi
          [ -z "$COUNT" ] && COUNT=0
          printf 'count=%s\n' "$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## R5 Garde-fou doctrine anti-fuite"
            echo ""
            echo "Findings : **$COUNT**"
            if [ "$COUNT" -gt 0 ]; then
              echo ""
              echo '```'
              awk -F'\t' '$2!="META"' findings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Ouvrir / mettre à jour une issue (alert-only, Cran B)
        if: steps.summary.outputs.count != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create routine --color 1d76db --description "Routine de surveillance (détecte/signale)" --force >/dev/null 2>&1 || true
          BODY=$(mktemp)
          {
            echo "Le garde-fou doctrine R5 a détecté **${{ steps.summary.outputs.count }}** signalement(s) potentiel(s) de fuite sur une surface publique."
            echo ""
            echo "- Événement : \`${{ github.event_name }}\` · Ref : \`${{ github.ref }}\`"
            echo "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Emplacements (la chaîne sensible n'est jamais recopiée — fichier:ligne / classe / label) :"
            echo '```'
            awk -F'\t' '$2!="META"' findings.txt
            echo '```'
            echo ""
            echo "Classes : **FUITE** (financement/identité/corpus) · **PROSCRIT** (formulation interdite) · **GELE** (bloc gelé modifié → relecture physicien)."
            echo "Faux positif ? → ajouter \`fichier<TAB>label\` à \`.github/scripts/leak_guard_allowlist.txt\`."
            echo ""
            echo "> Alert-only (le build n'est pas cassé). Correction d'un contenu public = Cran C, décision Soleil."
          } > "$BODY"
          EXISTING=$(gh issue list --state open --label routine --search "in:title [routine:leak-guard]" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            gh issue create --title "[routine:leak-guard] Fuite doctrine potentielle sur surface publique" --label routine --body-file "$BODY"
          fi

      - name: Gate bloquant (PR uniquement — FUITE / CONFIG)
        # Rend le check MORDANT sur pull_request : échoue (merge bloqué) si findings.txt porte au
        # moins un finding de classe FUITE (fuite réelle : identité, modules confidentiels, corpus,
        # financement, SIRET…) ou CONFIG (scanner dégradé : secret absent, fichier sauté par le cap
        # de taille, régex invalide, grep en échec, scan interrompu, surface vide, findings.txt
        # absent → fail-closed, un scan requis n'est jamais silencieusement aveugle ni partiel).
        # PROSCRIT / GELÉ NON bloquants (déjà signalés en issue) : évite de geler main sur de la
        # pédagogie (exception cité/réfuté) ou un edit de zone gelée légitime (process physicien).
        # Ne recopie JAMAIS la chaîne sensible : fichier:ligne + classe/label seulement.
        # Faux positif légitime → allowlister « chemin<TAB>label » dans leak_guard_allowlist.txt.
        if: github.event_name == 'pull_request'
        run: |
          set -e
          if [ ! -f findings.txt ]; then
            echo "::error::Garde-fou anti-fuite : findings.txt ABSENT (le scanner n'a produit aucune sortie). Fail-closed."
            exit 1
          fi
          # Sentinelle positive : le scanner émet TOUJOURS une ligne META en fin de vie (trap).
          # Son absence = le scanner ne s'est jamais exécuté (erreur de syntaxe → findings.txt
          # vide mais existant) ou a été tué avant son trap → fail-closed, pas de faux vert.
          if ! awk -F'\t' '$2=="META"{ok=1} END{exit ok?0:1}' findings.txt; then
            echo "::error::Garde-fou anti-fuite : sentinelle de fin de scan ABSENTE (scanner jamais exécuté ou tué avant son trap). Fail-closed."
            exit 1
          fi
          if awk -F'\t' '$2=="FUITE"||$2=="CONFIG"{c++} END{exit (c>0)?0:1}' findings.txt; then
            echo "::error::Garde-fou anti-fuite : marqueur BLOQUANT détecté (classe FUITE/CONFIG). Merge bloqué."
            echo "Emplacements bloquants (la chaîne sensible n'est jamais recopiée) :"
            awk -F'\t' '$2=="FUITE"||$2=="CONFIG"{print "  "$1"  ["$2"/"$3"]"}' findings.txt
            echo ""
            echo "→ Fuite réelle : retirer la mention (contenu public = Cran C, décision Soleil)."
            echo "→ Faux positif légitime : allowlister « chemin<TAB>label » dans .github/scripts/leak_guard_allowlist.txt."
            echo "→ CONFIG : configurer le secret manquant (LEAK_TERMS_REGEX / LEAK_CONFIDENTIAL_REGEX)."
            exit 1
          fi
          echo "Gate anti-fuite : aucun marqueur bloquant (FUITE/CONFIG). OK."
