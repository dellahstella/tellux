name: R1 — Smoke-test post-déploiement (prod)

# Routine R1 (brief Routines débloquées, 2026-06-21). Substrat : GitHub Actions
# (déterministe, ADR-010). DÉTECTE et SIGNALE uniquement (Cran B : ouvre une
# issue sur échec DUR). NE corrige rien : pas de rollback, pas de redéploiement,
# lecture seule sur la prod.
#
# Échec DUR (issue + run rouge) = route ≠ 200 / Leaflet non monté / exception.
# Les signaux plus flous (boot data, console, pageerror) sont des WARNINGS
# rapportés, pas d'issue (Phase A — éviter les faux positifs, cf.
# eval-app-rubric.yml). Promotion possible après observation.
#
# Déclencheurs : deployment_status (Production) + cron quotidien + dispatch.
# Activation : ne tourne que depuis main (branche par défaut) — gate Cran C.

on:
  deployment_status: {}
  schedule:
    - cron: '17 6 * * *'   # ~quotidien, 06:17 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL prod à tester (défaut https://tellux.pages.dev)"
        required: false
        default: "https://tellux.pages.dev"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke prod (lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/blindage-harness/package-lock.json

      - name: Install npm deps (tests/blindage-harness)
        working-directory: tests/blindage-harness
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests/blindage-harness
        run: npx playwright install --with-deps chromium

      - name: Run smoke-prod (lecture seule)
        id: smoke
        working-directory: tests/blindage-harness
        env:
          SMOKE_BASE: ${{ github.event.inputs.base_url || 'https://tellux.pages.dev' }}
        run: |
          set +e
          # Écrire le rapport à la RACINE du workspace (chemin absolu) pour que
          # les étapes suivantes (résumé / issue / artifact) le retrouvent quelle
          # que soit leur working-directory.
          node smoke-prod.mjs > "$GITHUB_WORKSPACE/smoke-result.json"
          EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          echo "----- smoke-result.json -----"
          cat "$GITHUB_WORKSPACE/smoke-result.json"
          {
            echo "## R1 Smoke-test prod — \`$SMOKE_BASE\`"
            echo ""
            if [ "$EXIT" = "0" ]; then echo "### ✅ Routes critiques OK (warnings éventuels ci-dessous)"; else echo "### ❌ Échec DUR — voir détail"; fi
            echo ""
            echo '```json'
            cat "$GITHUB_WORKSPACE/smoke-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload smoke result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-prod-result
          path: smoke-result.json
          retention-days: 14
          if-no-files-found: warn

      - name: Ouvrir / mettre à jour une issue sur échec DUR (Cran B)
        if: steps.smoke.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create routine --color 1d76db --description "Routine de surveillance (détecte/signale, Cran B)" --force >/dev/null 2>&1 || true
          BODY_FILE=$(mktemp)
          {
            echo "La routine R1 (smoke-test post-déploiement) a détecté un échec DUR sur la prod."
            echo ""
            echo "- Déclencheur : \`${{ github.event_name }}\`"
            echo "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Rapport :"
            echo '```json'
            cat "$GITHUB_WORKSPACE/smoke-result.json"
            echo '```'
            echo ""
            echo "> Détecté automatiquement (Cran B). Toute correction (rollback / redéploiement) est Cran C — décision Soleil."
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --state open --label routine --search "in:title [routine:smoke]" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "[routine:smoke] Échec smoke-test post-déploiement prod" --label routine --body-file "$BODY_FILE"
          fi

      - name: Marquer le run rouge si échec DUR
        if: steps.smoke.outputs.exit != '0'
        run: exit 1
