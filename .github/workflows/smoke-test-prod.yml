name: R1 — Smoke-test post-déploiement (prod)

# Routine R1 (brief Routines débloquées, 2026-06-21). Substrat : GitHub Actions
# (déterministe, ADR-010). DÉTECTE et SIGNALE uniquement (Cran B : ouvre une
# issue sur échec). NE corrige rien : pas de rollback, pas de redéploiement,
# lecture seule sur la prod.
#
# Déclencheurs :
#   - deployment_status : à chaque déploiement Cloudflare Pages réussi en
#     PRODUCTION (les déploiements Preview sont ignorés via le `if` du job) ;
#   - schedule : filet quotidien (au cas où un deployment_status manquerait) ;
#   - workflow_dispatch : à la demande.
#
# NB activation : un workflow planifié / sur événement ne tourne que depuis la
# branche par défaut (main). Cette routine n'est donc active qu'une fois la PR
# mergée dans main — c'est le gate Cran C (GO Soleil).

on:
  deployment_status: {}
  schedule:
    - cron: '17 6 * * *'   # ~quotidien, 06:17 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL prod à tester (défaut https://tellux.pages.dev)"
        required: false
        default: "https://tellux.pages.dev"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Smoke prod (lecture seule)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Sur deployment_status : ne tourner que pour un déploiement PRODUCTION
    # réussi (ignorer Preview et les états en cours/échoués). Les autres
    # déclencheurs (schedule, dispatch) passent toujours.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/blindage-harness/package-lock.json

      - name: Install npm deps (tests/blindage-harness)
        working-directory: tests/blindage-harness
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: tests/blindage-harness
        run: npx playwright install --with-deps chromium

      - name: Run smoke-prod (lecture seule)
        id: smoke
        working-directory: tests/blindage-harness
        env:
          SMOKE_BASE: ${{ github.event.inputs.base_url || 'https://tellux.pages.dev' }}
        run: |
          set +e
          node smoke-prod.mjs > smoke-result.json
          EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          {
            echo "## R1 Smoke-test prod — \`$SMOKE_BASE\`"
            echo ""
            if [ "$EXIT" = "0" ]; then echo "### ✅ Toutes les routes critiques OK"; else echo "### ❌ Échec smoke — voir détail"; fi
            echo ""
            echo '```json'
            cat smoke-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Ouvrir / mettre à jour une issue sur échec (Cran B)
        if: steps.smoke.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create routine --color 1d76db --description "Routine de surveillance (détecte/signale, Cran B)" --force >/dev/null 2>&1 || true
          TITLE="[routine:smoke] Échec smoke-test post-déploiement prod"
          BODY_FILE=$(mktemp)
          {
            echo "La routine R1 (smoke-test post-déploiement) a détecté un problème sur la prod."
            echo ""
            echo "- Déclencheur : \`${{ github.event_name }}\`"
            echo "- Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Rapport :"
            echo '```json'
            cat smoke-result.json
            echo '```'
            echo ""
            echo "> Détecté automatiquement (Cran B). Toute correction (rollback / redéploiement) est Cran C — décision Soleil."
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --state open --label routine --search "in:title [routine:smoke]" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label routine --body-file "$BODY_FILE"
          fi

      - name: Marquer le run rouge si échec
        if: steps.smoke.outputs.exit != '0'
        run: exit 1
